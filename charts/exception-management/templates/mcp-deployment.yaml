{{- if .Values.mcp.enabled }}
{{- include "exception-management.requireDatabase" . -}}
{{- include "exception-management.requireNoModeEnv" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exception-management.mcpFullname" . }}
  labels:
    {{- include "exception-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "exception-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "exception-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "exception-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "exception-management.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/mcp/main.go: MCP_ADDR, LOG_LEVEL,
          # DATABASE_URL and (migration step only) MIGRATIONS_DATABASE_URL.
          # cmd/mcp has no auth env, builds no outbox/unit of work (it can
          # never write), starts no relay, runs no SLA sweeper, runs none of
          # the six fact consumers and never dials Kafka (no KAFKA_BROKERS,
          # no consumer groups here). It is the read-only ops-agent surface.
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "exception-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/mcp runs the idempotent embedded migrations on start (like
            # the api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "exception-management.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/mcp, so the probes have a cheap target.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
