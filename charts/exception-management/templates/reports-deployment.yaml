{{- if .Values.analytics.enabled }}
{{- include "exception-management.requireAnalyticsConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exception-management.analyticsReportsFullname" . }}
  labels:
    {{- include "exception-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
spec:
  replicas: {{ .Values.analytics.reports.replicaCount }}
  selector:
    matchLabels:
      {{- include "exception-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-reports
  template:
    metadata:
      labels:
        {{- include "exception-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-reports
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "exception-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reports
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "exception-management.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/exceptions-reports"]
          ports:
            - name: http
              containerPort: {{ .Values.analytics.reports.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/exceptions-reports/main.go:
          # ANALYTICS_DATABASE_URL (required, opened through a read-only
          # pool), HTTP_ADDR and LOG_LEVEL. It writes nothing, never opens
          # the OLTP database and never dials Kafka (no KAFKA_BROKERS here):
          # GET /reports/root-cause-frequency, /reports/mean-time-to-resolve,
          # /reports/sla-breach-rate and /reports/freshness on :8092, plus
          # /healthz for the probes. No auth (fleet rule): the in-cluster
          # boundary is the access control.
          env:
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "exception-management.analyticsSecretName" . }}
                  key: {{ .Values.analytics.existingSecretKey }}
            - name: HTTP_ADDR
              value: {{ .Values.analytics.reports.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- range .Values.analytics.reports.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.analytics.reports.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exception-management.analyticsReportsFullname" . }}
  labels:
    {{- include "exception-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
spec:
  type: {{ .Values.analytics.reports.service.type }}
  ports:
    - port: {{ .Values.analytics.reports.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # Pins component=analytics-reports like every other Service in this
  # chart: name+instance alone would select every pod of the release
  # (tests/test_service_selectors.py).
  selector:
    {{- include "exception-management.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
{{- end }}
